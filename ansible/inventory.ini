# Ansible Inventory for SmartPath Infrastructure
# Update these values based on your Terraform outputs

[app_server]
app-vm ansible_host=10.0.2.4

[app_server:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=../terraform/ssh_key.pem
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q -i ../terraform/ssh_key.pem azureuser@4.213.170.37"'
ansible_python_interpreter=/usr/bin/python3

