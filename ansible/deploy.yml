---
# Ansible Playbook: Deploy SmartPath Application
# This playbook deploys the SmartPath application using Docker Compose
# It pulls images from Azure Container Registry and manages the application lifecycle

- name: Deploy SmartPath Application
  hosts: app_server
  become: yes
  vars:
    app_directory: "/opt/smartpath"
    docker_compose_file: "docker-compose.prod.yml"

  tasks:
    - name: Ensure application directory exists
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      tags: [deploy, setup]

    # Log in to Azure Container Registry
    - name: Log in to Azure Container Registry
      community.docker.docker_login:
        registry: "{{ acr_login_server }}"
        username: "{{ acr_username }}"
        password: "{{ acr_password }}"
        reauthorize: yes
      tags: [deploy, acr]

    # Create docker-compose production file
    - name: Create docker-compose.prod.yml
      copy:
        dest: "{{ app_directory }}/{{ docker_compose_file }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
        content: |
          services:
            backend:
              image: {{ acr_login_server }}/smartpath-backend:latest
              container_name: smartpath-backend
              ports:
                - "5000:5000"
              environment:
                - FLASK_APP=app.py
                - FLASK_ENV=production
                - SECRET_KEY=${SECRET_KEY}
                - DATABASE_URL=postgresql://{{ db_user }}:{{ db_password }}@{{ db_host }}/{{ db_name }}
              networks:
                - smartpath-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:5000/api/health", "||", "exit", "1"]
                interval: 30s
                timeout: 10s
                retries: 5
                start_period: 60s
              logging:
                driver: "json-file"
                options:
                  max-size: "10m"
                  max-file: "3"

            frontend:
              image: {{ acr_login_server }}/smartpath-frontend:latest
              container_name: smartpath-frontend
              ports:
                - "80:80"
                - "443:443"
              environment:
                - REACT_APP_API_URL=http://{{ ansible_host }}:5000
              depends_on:
                - backend
              networks:
                - smartpath-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s
              logging:
                driver: "json-file"
                options:
                  max-size: "10m"
                  max-file: "3"

          networks:
            smartpath-network:
              driver: bridge
      tags: [deploy, config]

    # Create .env file with sensitive information
    - name: Create .env file with environment variables
      copy:
        dest: "{{ app_directory }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
        content: |
          # Database Configuration
          DB_HOST={{ db_host }}
          DB_NAME={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}

          # Application Configuration
          SECRET_KEY={{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}
          FLASK_ENV=production

          # Azure Container Registry
          ACR_LOGIN_SERVER={{ acr_login_server }}
      tags: [deploy, config]

    # Stop existing containers
    - name: Stop existing containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        files:
          - "{{ docker_compose_file }}"
        state: absent
      ignore_errors: yes
      tags: [deploy, stop]

    # Pull latest images from ACR
    - name: Pull latest images from Azure Container Registry
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        files:
          - "{{ docker_compose_file }}"
        pull: always
      tags: [deploy, pull]

    # Start application containers
    - name: Start application containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        files:
          - "{{ docker_compose_file }}"
        state: present
        recreate: always
        wait: no
      register: docker_result
      ignore_errors: yes
      tags: [deploy, start]

    - name: Wait for containers to start
      shell: sleep 10
      when: docker_result is defined
      tags: [deploy, start]

    - name: Check backend container logs
      command: docker logs smartpath-backend --tail 50
      register: backend_logs
      ignore_errors: yes
      tags: [deploy, start]

    - name: Display backend logs
      debug:
        var: backend_logs.stdout_lines
      when: backend_logs is defined
      tags: [deploy, start]

    - name: Check if backend is responding
      uri:
        url: "http://localhost:5000/"
        status_code:
          - 200
          - 404
      register: backend_health
      ignore_errors: yes
      tags: [deploy, start]

    - name: Display backend health status
      debug:
        msg: "Backend is {{ 'UP' if backend_health.status is defined and backend_health.status in [200, 404] else 'DOWN' }}"
      when: backend_health is defined
      tags: [deploy, start]


    # Clean up old Docker images
    - name: Clean up old Docker images
      community.docker.docker_prune:
        images: yes
        images_filters:
          dangling: false
      tags: [deploy, cleanup]

    # Verify deployment
    - name: Get running containers
      shell: docker compose -f {{ docker_compose_file }} ps
      args:
        chdir: "{{ app_directory }}"
      register: docker_ps
      changed_when: false
      ignore_errors: yes
      tags: [deploy, verify]

    - name: Display running containers
      debug:
        msg: "{{ docker_ps.stdout_lines }}"
      tags: [deploy, verify]

    # Check container logs for errors
    - name: Check backend logs for errors
      shell: docker logs smartpath-backend --tail 50 2>&1 | grep -i "error" || echo "No errors found"
      register: backend_logs
      changed_when: false
      tags: [deploy, verify]

    - name: Check frontend logs for errors
      shell: docker logs smartpath-frontend --tail 50 2>&1 | grep -i "error" || echo "No errors found"
      register: frontend_logs
      changed_when: false
      tags: [deploy, verify]

    - name: Display backend log check results
      debug:
        msg: "{{ backend_logs.stdout }}"
      tags: [deploy, verify]

    - name: Display frontend log check results
      debug:
        msg: "{{ frontend_logs.stdout }}"
      tags: [deploy, verify]

    # Final deployment status
    - name: Deployment completion message
      debug:
        msg: |
          ============================================
          Deployment Completed Successfully!
          ============================================
          Application Directory: {{ app_directory }}
          Backend URL: http://{{ ansible_host }}:5000
          Frontend URL: http://{{ ansible_host }}

          Images deployed:
          - {{ acr_login_server }}/smartpath-backend:latest
          - {{ acr_login_server }}/smartpath-frontend:latest

          Use 'docker compose -f {{ docker_compose_file }} logs -f' to view logs
          ============================================
      tags: [deploy, verify]
