---
- name: Deploy Application to Production
  hosts: app_server
  become: yes
  gather_facts: yes

  vars:
    acr_login_server: "{{ acr_login_server | default('smartpathacruepjie.azurecr.io') }}"
    acr_username: "{{ acr_username | default('smartpathacruepjie') }}"
    acr_password: "{{ acr_password }}"
    app_dir: "/opt/smartpath"
    frontend_image: "{{ acr_login_server }}/smartpath-frontend:latest"
    backend_image: "{{ acr_login_server }}/smartpath-backend:latest"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - git
          - curl
          - wget
          - ca-certificates
          - gnupg
          - lsb-release
          - python3-pip
          - software-properties-common
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Install Docker Compose standalone (backup method)
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      when: ansible_user != 'root'

    - name: Verify Docker installation
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "Docker installed: {{ docker_version.stdout }}"

    - name: Verify Docker Compose installation
      command: docker compose version
      register: docker_compose_version
      changed_when: false
      ignore_errors: yes

    - name: Display Docker Compose version
      debug:
        msg: "Docker Compose installed: {{ docker_compose_version.stdout }}"

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Login to Azure Container Registry
      docker_login:
        registry_url: "{{ acr_login_server }}"
        username: "{{ acr_username }}"
        password: "{{ acr_password }}"
      no_log: true  # Don't log the password

    - name: Create docker-compose.yml file
      template:
        src: docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Create .env file for docker-compose
      template:
        src: env.template.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      vars:
        db_host: "{{ db_host | default('smartpath-db-19m303.postgres.database.azure.com') }}"
        db_name: "{{ db_name | default('smartpath-db-19m303') }}"
        db_user: "{{ db_user | default('dbadmin') }}"
        db_password: "{{ db_password }}"

    - name: Pull latest Docker images
      docker_compose:
        project_src: "{{ app_dir }}"
        pull: yes
        images: force_pull
      environment:
        COMPOSE_FILE: "{{ app_dir }}/docker-compose.yml"

    - name: Stop existing containers
      docker_compose:
        project_src: "{{ app_dir }}"
        state: absent
      ignore_errors: yes

    - name: Deploy application with docker-compose
      docker_compose:
        project_src: "{{ app_dir }}"
        state: present
        restarted: yes
        pull: yes
      environment:
        COMPOSE_FILE: "{{ app_dir }}/docker-compose.yml"

    - name: Verify containers are running
      command: docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: running_containers
      changed_when: false

    - name: Display running containers
      debug:
        msg: "{{ running_containers.stdout_lines }}"

