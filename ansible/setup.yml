---
# Ansible Playbook: Setup VM with Docker and Required Packages
# This playbook configures a fresh VM with all necessary dependencies
# for running the SmartPath application

- name: Configure VM for SmartPath Application
  hosts: app_server
  become: yes
  vars:
    docker_compose_version: "2.24.0"
    app_directory: "/opt/smartpath"

  tasks:
    # Update system packages
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      tags: [system, packages]

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      tags: [system, packages]

    # Install required system packages
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - python3
          - python3-pip
          - git
          - vim
          - htop
          - net-tools
          - unzip
          - jq
        state: present
        update_cache: yes
      tags: [system, packages]

    # Docker installation
    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      tags: [docker]

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      tags: [docker]

    - name: Add Docker repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list
      tags: [docker]

    - name: Update apt cache after adding Docker repository
      apt:
        update_cache: yes
      tags: [docker]

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      tags: [docker]

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
      tags: [docker]

    - name: Add application user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      tags: [docker]

    # Docker Compose standalone installation (for compatibility)
    - name: Download Docker Compose standalone
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      tags: [docker, docker-compose]

    - name: Verify Docker installation
      command: docker --version
      register: docker_version
      changed_when: false
      tags: [docker, verify]

    - name: Verify Docker Compose plugin installation
      command: docker compose version
      register: docker_compose_plugin_version
      changed_when: false
      tags: [docker, docker-compose, verify]

    - name: Verify Docker Compose standalone installation
      command: docker-compose --version
      register: docker_compose_version_output
      changed_when: false
      tags: [docker, docker-compose, verify]

    - name: Display Docker version
      debug:
        msg: "{{ docker_version.stdout }}"
      tags: [docker, verify]

    - name: Display Docker Compose plugin version
      debug:
        msg: "{{ docker_compose_plugin_version.stdout }}"
      tags: [docker, docker-compose, verify]

    - name: Display Docker Compose standalone version
      debug:
        msg: "{{ docker_compose_version_output.stdout }}"
      tags: [docker, docker-compose, verify]

    # Create application directory
    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      tags: [app]

    # Install Python packages for Docker management
    - name: Install Python Docker SDK
      pip:
        name:
          - docker
          - docker-compose
        state: present
        executable: pip3
      tags: [python, docker]

    # Configure firewall (UFW)
    - name: Install UFW firewall
      apt:
        name: ufw
        state: present
      tags: [security, firewall]

    - name: Allow SSH through firewall
      ufw:
        rule: allow
        port: '22'
        proto: tcp
      tags: [security, firewall]

    - name: Allow HTTP through firewall
      ufw:
        rule: allow
        port: '80'
        proto: tcp
      tags: [security, firewall]

    - name: Allow HTTPS through firewall
      ufw:
        rule: allow
        port: '443'
        proto: tcp
      tags: [security, firewall]

    - name: Allow application port through firewall
      ufw:
        rule: allow
        port: '5000'
        proto: tcp
      tags: [security, firewall]

    - name: Enable UFW firewall
      ufw:
        state: enabled
        policy: deny
        direction: incoming
      tags: [security, firewall]

    # System optimization
    - name: Configure system limits for Docker
      blockinfile:
        path: /etc/security/limits.conf
        block: |
          * soft nofile 65536
          * hard nofile 65536
          * soft nproc 65536
          * hard nproc 65536
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Docker limits"
      tags: [system, optimization]

    # Install monitoring tools
    - name: Install monitoring tools
      apt:
        name:
          - sysstat
          - iotop
          - nethogs
        state: present
      tags: [monitoring]

    # Final message
    - name: Setup completion message
      debug:
        msg: |
          ===================================
          VM Setup Completed Successfully!
          ===================================
          Docker version: {{ docker_version.stdout }}
          Docker Compose plugin: {{ docker_compose_plugin_version.stdout }}
          Docker Compose standalone: {{ docker_compose_version_output.stdout }}
          Application directory: {{ app_directory }}

          The VM is now ready for application deployment.
          ===================================
      tags: [verify]
