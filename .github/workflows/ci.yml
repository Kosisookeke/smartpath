name: CI Pipeline

# Trigger on pull requests to main branch
on:
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing
        continue-on-error: true # Don't fail on test errors for now

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Docker image
      - name: Build Backend Docker image
        run: |
          docker build -t smartpath-backend:latest -f backend/Dockerfile ./backend
          docker tag smartpath-backend:latest smartpath-backend:${{ github.sha }}

      # Build Frontend Docker image
      - name: Build Frontend Docker image
        run: |
          docker build -t smartpath-frontend:latest -f frontend/Dockerfile ./frontend
          docker tag smartpath-frontend:latest smartpath-frontend:${{ github.sha }}

      # Security: Scan Backend Docker image for vulnerabilities
      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartpath-backend:latest'
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Warn but don't fail on vulnerabilities

      # Security: Scan Frontend Docker image for vulnerabilities
      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartpath-frontend:latest'
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Warn but don't fail on vulnerabilities

      # Security: Scan Terraform code
      - name: Run tfsec security scanner
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/
          soft_fail: false # Fail the build on security issues

      # Log in to Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: false

      # Build, tag, and push Backend image to ACR
      - name: Build, tag, and push Backend image to ACR
        run: |
          ACR_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG=${{ github.sha }}
          
          docker tag smartpath-backend:latest ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}
          docker tag smartpath-backend:latest ${ACR_SERVER}/smartpath-backend:latest
          
          docker push ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}
          docker push ${ACR_SERVER}/smartpath-backend:latest
          
          echo "✅ Backend image pushed to ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}"

      # Build, tag, and push Frontend image to ACR
      - name: Build, tag, and push Frontend image to ACR
        run: |
          ACR_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG=${{ github.sha }}
          
          docker tag smartpath-frontend:latest ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}
          docker tag smartpath-frontend:latest ${ACR_SERVER}/smartpath-frontend:latest
          
          docker push ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}
          docker push ${ACR_SERVER}/smartpath-frontend:latest
          
          echo "✅ Frontend image pushed to ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}"
