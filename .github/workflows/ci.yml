name: CI Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Backend CI job
  backend-ci:
    name: Backend - Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting with flake8
        working-directory: ./backend
        run: |
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ tests/ --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with pytest
        working-directory: ./backend
        run: |
          pytest tests/test_simple.py -v

      - name: Build Docker image
        working-directory: ./backend
        run: |
          docker build -t smartpath-backend:test .

  # Frontend CI job
  frontend-ci:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting with ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false

      - name: Build application
        working-directory: ./frontend
        env:
          CI: false
        run: npm run build

      - name: Build Docker image
        working-directory: ./frontend
        run: |
          docker build -t smartpath-frontend:test .

  # Docker Compose validation
  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config

      - name: Build all services
        run: |
          docker compose build

      - name: Test service startup
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
          docker compose logs
          docker compose down
