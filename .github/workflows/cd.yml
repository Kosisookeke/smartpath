name: CD Pipeline - Deploy to Production

# Trigger on merge to main/master branch
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Backend image
      - name: Build Backend Docker image
        run: |
          docker build -t smartpath-backend:latest -f backend/Dockerfile ./backend
          docker tag smartpath-backend:latest smartpath-backend:${{ github.sha }}

      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartpath-backend:latest'
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Warn but don't fail on vulnerabilities

      # Build and push Frontend image
      - name: Build Frontend Docker image
        run: |
          docker build -t smartpath-frontend:latest -f frontend/Dockerfile ./frontend
          docker tag smartpath-frontend:latest smartpath-frontend:${{ github.sha }}

      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartpath-frontend:latest'
          format: 'sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Warn but don't fail on vulnerabilities

      # Log in to Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: false

      # Push Backend image to ACR
      - name: Push Backend image to ACR
        run: |
          ACR_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG=${{ github.sha }}
          
          docker tag smartpath-backend:latest ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}
          docker tag smartpath-backend:latest ${ACR_SERVER}/smartpath-backend:latest
          
          docker push ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}
          docker push ${ACR_SERVER}/smartpath-backend:latest
          
          echo "✅ Backend image pushed to ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}"

      # Push Frontend image to ACR
      - name: Push Frontend image to ACR
        run: |
          ACR_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG=${{ github.sha }}
          
          docker tag smartpath-frontend:latest ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}
          docker tag smartpath-frontend:latest ${ACR_SERVER}/smartpath-frontend:latest
          
          docker push ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}
          docker push ${ACR_SERVER}/smartpath-frontend:latest
          
          echo "✅ Frontend image pushed to ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible
          ansible --version

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.BASTION_PUBLIC_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.APP_VM_PRIVATE_IP }} >> ~/.ssh/known_hosts

      - name: Update Ansible inventory with secrets
        run: |
          cat > ansible/inventory.ini << EOF
          [app_server]
          app-vm ansible_host=${{ secrets.APP_VM_PRIVATE_IP }}

          [app_server:vars]
          ansible_user=azureuser
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q -i ~/.ssh/id_rsa azureuser@${{ secrets.BASTION_PUBLIC_IP }}"'
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Test Ansible connection
        run: |
          ansible app_server -i ansible/inventory.ini -m ping

      - name: Deploy application with Ansible
        run: |
          cd ansible
          ansible-playbook deploy.yml \
            -e "acr_login_server=${{ secrets.ACR_LOGIN_SERVER }}" \
            -e "acr_username=${{ secrets.ACR_USERNAME }}" \
            -e "acr_password=${{ secrets.ACR_PASSWORD }}" \
            -e "db_host=${{ secrets.DB_HOST }}" \
            -e "db_name=${{ secrets.DB_NAME }}" \
            -e "db_user=${{ secrets.DB_USER }}" \
            -e "db_password=${{ secrets.DB_PASSWORD }}"

      - name: Verify deployment
        run: |
          ansible app_server -i ansible/inventory.ini -m shell -a "cd /opt/smartpath && docker compose ps"

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

