name: CD Pipeline - Deploy to Production

# Trigger on merge to main/master branch
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ACR_LOGIN_SERVER
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Backend image
      - name: Build Backend Docker image
        run: |
          docker build -t smartpath-backend:latest -f backend/Dockerfile ./backend
          docker tag smartpath-backend:latest smartpath-backend:${{ github.sha }}

      # Security: Scan Backend Docker image for vulnerabilities
      - name: Run Trivy vulnerability scanner on Backend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'smartpath-backend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail build (informational only)
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner on Backend (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartpath-backend:latest'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy Backend scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend-cd'
        continue-on-error: true

      # Build and push Frontend image
      - name: Build Frontend Docker image
        run: |
          docker build -t smartpath-frontend:latest -f frontend/Dockerfile ./frontend
          docker tag smartpath-frontend:latest smartpath-frontend:${{ github.sha }}

      # Security: Scan Frontend Docker image for vulnerabilities
      - name: Run Trivy vulnerability scanner on Frontend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'smartpath-frontend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Don't fail build (informational only)
          vuln-type: 'os,library'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner on Frontend (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smartpath-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy Frontend scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend-cd'
        continue-on-error: true

      # Security: Scan Docker Compose file
      - name: Run Trivy vulnerability scanner on Docker Compose
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './docker-compose.yml'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Warn only for Docker Compose issues

      # Log in to Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        continue-on-error: false

      # Push Backend image to ACR
      - name: Push Backend image to ACR
        run: |
          ACR_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG=${{ github.sha }}
          
          docker tag smartpath-backend:latest ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}
          docker tag smartpath-backend:latest ${ACR_SERVER}/smartpath-backend:latest
          
          docker push ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}
          docker push ${ACR_SERVER}/smartpath-backend:latest
          
          echo "✅ Backend image pushed to ${ACR_SERVER}/smartpath-backend:${IMAGE_TAG}"

      # Push Frontend image to ACR
      - name: Push Frontend image to ACR
        run: |
          ACR_SERVER=${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG=${{ github.sha }}
          
          docker tag smartpath-frontend:latest ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}
          docker tag smartpath-frontend:latest ${ACR_SERVER}/smartpath-frontend:latest
          
          docker push ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}
          docker push ${ACR_SERVER}/smartpath-frontend:latest
          
          echo "✅ Frontend image pushed to ${ACR_SERVER}/smartpath-frontend:${IMAGE_TAG}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ACR_LOGIN_SERVER
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          pip install ansible
          ansible --version

      - name: Setup SSH
        run: |
          set -e
          echo "Setting up SSH configuration..."

          # Validate required secrets are set
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ ERROR: SSH_PRIVATE_KEY secret is not set"
            exit 1
          fi

          if [ -z "${{ secrets.BASTION_PUBLIC_IP }}" ]; then
            echo "❌ ERROR: BASTION_PUBLIC_IP secret is not set"
            exit 1
          fi

          if [ -z "${{ secrets.APP_VM_PRIVATE_IP }}" ]; then
            echo "❌ ERROR: APP_VM_PRIVATE_IP secret is not set"
            exit 1
          fi

          # Create SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH private key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Validate SSH key format
          if ! ssh-keygen -l -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "❌ ERROR: SSH_PRIVATE_KEY is not a valid SSH private key"
            echo "Please check that the secret contains a valid RSA/ED25519 private key"
            exit 1
          fi

          echo "✓ SSH private key configured"

          # Scan bastion host key
          echo "Scanning bastion host: ${{ secrets.BASTION_PUBLIC_IP }}"
          if ! ssh-keyscan -H -T 10 ${{ secrets.BASTION_PUBLIC_IP }} >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "⚠️  WARNING: Could not scan bastion host key"
            echo "This might cause issues if strict host key checking is enabled"
          else
            echo "✓ Bastion host key added"
          fi

          # Scan app VM host key (might fail if behind bastion, that's OK)
          echo "Scanning app VM host: ${{ secrets.APP_VM_PRIVATE_IP }}"
          if ! ssh-keyscan -H -T 10 ${{ secrets.APP_VM_PRIVATE_IP }} >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "⚠️  WARNING: Could not scan app VM host key (expected if behind bastion)"
          else
            echo "✓ App VM host key added"
          fi

          echo "✓ SSH setup complete"

      - name: Test Bastion Connectivity
        run: |
          echo "Testing bastion host connectivity..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa azureuser@${{ secrets.BASTION_PUBLIC_IP }} "echo 'Bastion connection successful'"
          echo "✓ Bastion reachable"

      - name: Update Ansible inventory with secrets
        run: |
          cat > ansible/inventory.ini << EOF
          [app_server]
          app-vm ansible_host=${{ secrets.APP_VM_PRIVATE_IP }}

          [app_server:vars]
          ansible_user=azureuser
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p -i ~/.ssh/id_rsa azureuser@${{ secrets.BASTION_PUBLIC_IP }}"'
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Test Ansible connection
        run: |
          ansible app_server -i ansible/inventory.ini -m ping

      - name: Check if Docker is installed
        id: docker_check
        run: |
          if ansible app_server -i ansible/inventory.ini -m command -a "docker --version" 2>/dev/null; then
            echo "docker_installed=true" >> $GITHUB_OUTPUT
          else
            echo "docker_installed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run setup playbook to install Docker
        if: steps.docker_check.outputs.docker_installed != 'true'
        run: |
          echo "Docker not found, running setup playbook..."
          cd ansible
          ansible-playbook -i inventory.ini setup.yml

      - name: Deploy application with Ansible
        run: |
          cd ansible
          ansible-playbook deploy.yml \
            -e "acr_login_server=${{ secrets.ACR_LOGIN_SERVER }}" \
            -e "acr_username=${{ secrets.ACR_USERNAME }}" \
            -e "acr_password=${{ secrets.ACR_PASSWORD }}" \
            -e "db_host=${{ secrets.DB_HOST }}" \
            -e "db_name=${{ secrets.DB_NAME }}" \
            -e "db_user=${{ secrets.DB_USER }}" \
            -e "db_password=${{ secrets.DB_PASSWORD }}"

      - name: Verify deployment
        run: |
          ansible app_server -i ansible/inventory.ini -m shell -a "cd /opt/smartpath && docker compose -f docker-compose.prod.yml ps"

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa

